name: anchor_night
description: עוגן לילה — הגנה דינמית ללילה עבור מתמודדי פוסט־טראומה.
publish_to: "none"
version: 0.4.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^6.1.1
  vibration: ^3.2.0
  shared_preferences: ^2.5.3
  just_audio: ^0.9.46
  record: ^6.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9+2
  uuid: ^4.5.1
  collection: ^1.19.1
  health: ^13.3.1
  flutter_foreground_task: ^9.1.0
  share_plus: ^10.1.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_native_splash: ^2.4.4
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#0B1014"
  image: assets/branding/icon.png
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#0B1014"
  adaptive_icon_foreground: assets/branding/icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/voice/
    - assets/branding/
